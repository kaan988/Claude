<script>
'use strict';
// ───────────────────────── constants ─────────────────────────
const W = 1920, H = 1080, FPS = 30, LON0 = -100;
const RED = '#D9291D', RED_DK = '#7E1610', INK = '#2B2118';

const VIEW_ROUTE = { lon: -122.905, lat: 49.032, Z: 12.25 };
const VIEW_CONT = { lon: -108.5, lat: 47.6, Z: 5.35 };

// ───────────────────────── timeline ─────────────────────────
const EV = [];                  // SFX events {t, sfx}

// ───────────────────────── camera ─────────────────────────

// ───────────────────────── canvases ─────────────────────────

// ───────────────────────── assets ─────────────────────────
const IMG = {};
const loadImg = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });

  for (const z of [9, 11, 13]) {
    IMG['land' + z] = await loadImg(`tiles/land_z${z}.png`);

    document.fonts.load('40px "Permanent Marker"'), document.fonts.load('28px "Special Elite"'),
    document.fonts.load('700 54px "Oswald"'), document.fonts.load('700 16px "Cormorant Garamond"')]);

// procedural textures (no stock): paper fibre texture, grain frames, card texture

  const s = 9; const gw = Math.ceil(W / s) + 2, gh = Math.ceil(H / s) + 2;

  x.globalAlpha = .05; x.fillStyle = '#8a6a3a';
  for (let i = 0; i < 40; i++) { const g = x.createRadialGradient(0, 0, 0, 0, 0, 1); x.save(); x.translate(Math.random() * W, Math.random() * H); x.scale(40 + Math.random() * 160, 30 + Math.random() * 120); x.beginPath(); x.arc(0, 0, 1, 0, 7); x.fill(); x.restore(); }

    for (let i = 0; i < gd.length; i += 4) { const v = 128 + (Math.random() + Math.random() + Math.random() - 1.5) * 150; gd[i] = gd[i + 1] = gd[i + 2] = v; gd[i + 3] = 255; }

// ───────────────────────── paper map pyramid (pre-rendered per zoom level) ─────────────────────────
const LEVELS = [];

    for (const f of feats) {
      const g = f.geometry; if (!g) continue;

    for (const [w, a] of [[30, .16], [19, .22], [10, .3]]) { x.strokeStyle = `rgba(70,105,115,${a})`; x.lineWidth = w; x.lineJoin = 'round'; x.beginPath(); path(GEO['land' + res]); x.stroke(); }

const PAPER_LABELS = [

  ['BRITISH COLUMBIA', -125, 54.2, 11, 5], ['ALBERTA', -114.5, 55, 11, 5], ['WASHINGTON', -120.6, 47.3, 11, 5],
  ['MONTANA', -109.6, 47, 11, 5], ['OREGON', -120.6, 44, 11, 5], ['Strait of Georgia', -123.9, 49.45, 10, 3], ['VANCOUVER I.', -125.8, 49.75, 9, 3]];

// ───────────────────────── satellite ─────────────────────────

function drawSatellite(ctx, c) {

// ───────────────────────── marker (boils at 8 fps) ─────────────────────────

// spring pop-in from 55% (damping 0.48, 19 rad/s) with rotation settle; exit shrinks + fades in 0.22 s
function spring(t) {
  if (t <= 0) return { s: .55, r: 1, a: 0 };
  const z = .48, w = 19, wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * t);
  const osc = e * (Math.cos(wd * t) + z / Math.sqrt(1 - z * z) * Math.sin(wd * t));
  return { s: 1 - .45 * osc, r: osc, a: clamp(t / .06) };
}
function popXf(t, t0, t1) {
  const sp = spring(t - t0); let s = sp.s, a = sp.a;

function withPop(ctx, t, t0, t1, x, y, rot, fn) {
