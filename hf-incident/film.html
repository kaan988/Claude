{

const NOTES = 360, noteMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(.22, .16), new THREE.MeshStandardMaterial({ color: 0xf1efe8, roughness: .9 }), NOTES);
noteMesh.position.set(0, 0, -2.95); noteMesh.count = 0; sandbox.add(noteMesh);

  for (let i = 0; i < NOTES; i++) { const x = (hash(i * 1.7) - .5) * 7.2, y = .5 + hash(i * 3.1) * 2.3; if (Math.abs(x - 1) < .75 && Math.abs(y - 1.7) < .5) { NOTEPOS.push(null); continue; }
    q.setFromEuler(new THREE.Euler(0, 0, (hash(i) - .5) * .5)); m.compose(new THREE.Vector3(x, y, 0), q, s); noteMesh.setMatrixAt(i, m); NOTEPOS.push(1); } }
const quoteCv = document.createElement('canvas'); quoteCv.width = 1024; quoteCv.height = 640; const quoteTex = new THREE.CanvasTexture(quoteCv); quoteTex.colorSpace = THREE.SRGBColorSpace; quoteTex.anisotropy = 8;

const rackGeo2 = new RoundedBoxGeometry(.62, 2.1, 1.0, 2, .02); rackGeo2.translate(0, 1.05, 0);
const clRacks = new THREE.InstancedMesh(rackGeo2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .85 }), RACKS); clRacks.castShadow = clRacks.receiveShadow = true; vd.add(clRacks);
const RACKPOS = [];
for (let c = 0; c < 3; c++) for (let r = 0; r < 2; r++) for (let k = 0; k < 12; k++) RACKPOS.push({ x: CL.x - 6 + k * .7, z: CL.z - 5 + c * 4 + r * 1.3, cluster: c, ry: r ? Math.PI : 0 });
// infection order: start at the dataset pod (cluster 0, first rack) and spread by distance through the clusters
const INF = RACKPOS.map((p, i) => ({ i, d: Math.hypot(p.x - RACKPOS[0].x, (p.z - RACKPOS[0].z) * 1.4) + p.cluster * 2 })).sort((a, b) => a.d - b.d).map((o, k) => ({ ...o, k }));
const INFRANK = new Array(RACKS); INF.forEach(o => INFRANK[o.i] = o.k);
const watchMat = new THREE.MeshStandardMaterial({ color: 0xd9e6ff, roughness: .85, emissive: new THREE.Color(BLUE), emissiveIntensity: 0 });
const watchdogs = [0, 1, 2].map(i => { const w = new THREE.Mesh(MANNEQUIN, watchMat); w.position.set(CL.x - 8.4 + i * .8, 0, CL.z + 5.5 - i * .5); w.rotation.y = -2.4 + i * .2; w.castShadow = true; vd.add(w); return w; });
const watchLight = new THREE.PointLight(BLUE, 0, 10, 2); watchLight.position.set(CL.x - 7.5, 2.5, CL.z + 6); vd.add(watchLight);
const redFlood = new THREE.PointLight(0xff2a1e, 0, 22, 1.6); redFlood.position.set(CL.x, 4, CL.z); vd.add(redFlood);
// the attack path: dotted line from the proxy across the floor to the first rack
const PATH = [new THREE.Vector3(SB.x + 5.6, .05, 0), new THREE.Vector3(SB.x + 14, .05, 3), new THREE.Vector3(CL.x - 18, .05, 6), new THREE.Vector3(CL.x - 8, .05, -1), new THREE.Vector3(RACKPOS[0].x, .05, RACKPOS[0].z + .8)];
const pathCurve = new THREE.CatmullRomCurve3(PATH);
const DOTS = 180, dots = new THREE.InstancedMesh(new THREE.CircleGeometry(.07, 12), new THREE.MeshBasicMaterial({ color: 0xff4a3a }), DOTS); dots.count = 0; vd.add(dots);
{ const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0)), s = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < DOTS; i++) { m.compose(pathCurve.getPointAt(i / (DOTS - 1)), q, s); dots.setMatrixAt(i, m); } }
// the internet: a faint line leaving the proxy into the dark

// ───────────────────────── timeline ─────────────────────────
const EV = []; const sfx = (t, name, gain = 1) => (EV.push({ t, sfx: name, gain }), t);
const lead = .06;
const K = {};   // all keyed times in one place
function keys() {
  K.uploads = T0('uploads') - lead; K.isnt = T0(/^isn'?t$/); K.its = T0("it's"); K.test = T1('test');
  K.they = T0('they'); K.switched = T0('switched'); K.sandbox2 = T0('sandbox', 2); K.door = T0('door'); K.internet = T0('internet'); K.proxy = T0('proxy');
  K.broke = T0('broke') - lead; K.notes = T0('notes'); K.wrote = T0('wrote'); K.cont = T1('continue');
  K.in = T0('in', 1); K.thirteen = T0(/^(thirteen|13)$/); K.control = T0('control'); K.clusters = T1('clusters');
  K.hf3 = T0('hugging', 3); K.watch = T0('watchdogs'); K.seventeen = T0(/^(seventeen|17)/); K.actions = T1('actions');

  sfx(K.wrote - .2, 'whoosh', .45); sfx(K.wrote + .2, 'typing'); sfx(K.in - .2, 'whoosh', .6); sfx(K.thirteen, 'alarm', .7);
  sfx(K.watch, 'radio'); sfx(K.seventeen, 'ticks'); sfx(K.third, 'rumble'); sfx(K.called - .2, 'whoosh', .7);
}

// camera shots: {t, dur, pos, look, fov}; holds creep slowly; dips to black between stages
const SHOTS = [];
function shot(t, dur, pos, look, fov = 32) { SHOTS.push({ t, dur, pos: new THREE.Vector3(...pos), look: new THREE.Vector3(...look), fov }); }
function buildShots() {
  // A: hall dolly (interior), dip to black after "Hugging Face."
  shot(0, 0, [-200, 1.55, 3], [-200, 1.2, -12], 34);
  shot(0, K.isnt - .3, [-199.75, 1.5, -11.2], [-200.9, 1.1, -16.6], 34);
  // B: the void: close on one figure, then the pull-back over 1,200 agents

  shot(K.isnt, K.its - K.isnt, [.7, 1.3, 8.0], [0, 1.0, 3.2], 30);
  shot(K.its, K.test - K.its + .3, [0, 15, 26], [0, 0, -9], 38);

  // F: push in to the hero note

const _p = new THREE.Vector3(), _l = new THREE.Vector3();
function camAt(t) {
  let pos = SHOTS[0].pos.clone(), look = SHOTS[0].look.clone(), fov = SHOTS[0].fov, tEnd = 0;
  for (const s of SHOTS) {
    if (t < s.t) break;
    if (s.dur === 0) { pos.copy(s.pos); look.copy(s.look); fov = s.fov; tEnd = s.t; continue; }
    const u = ease((t - s.t) / s.dur);
    const p0 = pos.clone(), l0 = look.clone(), f0 = fov;
    pos.lerpVectors(p0, s.pos, u); look.lerpVectors(l0, s.look, u); fov = lerp(f0, s.fov, u); tEnd = s.t + s.dur;
    if (t < tEnd) break;

  const hold = Math.max(0, t - tEnd), dir = _l.copy(look).sub(pos).normalize();
  pos.addScaledVector(dir, Math.min(hold, 8) * .045);
  pos.x += Math.sin(t * .31) * .012; pos.y += Math.sin(t * .23 + 1) * .01;
  return { pos, look, fov };
}
const stageAt = t => t < K.isnt - .3 ? 'hall' : 'void';
// dip to black between the stages (and at the very end)
function blackAt(t) {
  const a = T1('face') + .05, b = K.isnt - .1;
  if (t > a - .25 && t < b + .25) return Math.min(clamp((t - (a - .25)) / .3), clamp((b + .25 - t) / .3));

}

// ───────────────────────── 3D state per time (pure) ─────────────────────────
const M4 = new THREE.Matrix4(), V3 = new THREE.Vector3(), Q = new THREE.Quaternion(), S3 = new THREE.Vector3(), COL = new THREE.Color();
function setState(t) {

  const u = ease((t - K.uploads) / .9);
  dataset.position.set(-200 - 1.1 + lerp(.75, 0, u), 1.25, -16.45); dataset.rotation.y = Math.PI / 2;
  const red = clamp((t - K.uploads - .55) / .4);
  dataset.material.emissive.set(0xff2a1e); dataset.material.emissiveIntensity = red * .9;
  dsLight.position.set(-200.9, 1.4, -16.5); dsLight.intensity = red * 6;
  // void: hero figure turns red on "It's", crowd revealed by the widening key
  const r = clamp((t - K.its) / .6);
  heroMat.emissiveIntensity = r * .55; agentMat.emissiveIntensity = clamp((t - K.its - .3) / 1) * .45;
  // safeguards lever: ON (up-left, green) → OFF on "switched"
  const sw = easeOut((t - K.switched) / .25); lever.rotation.z = lerp(.6, -.6, sw);
  lampMat.emissiveIntensity = lerp(2.2, 0, sw); lampLight.intensity = lerp(2.5, 0, sw);
  // internet line appears on "internet"
  netLine.material.opacity = clamp((t - K.internet) / .5) * .7 * (1 - clamp((t - K.called) / .6) * .6);
  // the door bursts open
  const op = t > K.broke ? 1 - Math.exp(-(t - K.broke) * 9) * Math.cos((t - K.broke) * 14) : 0;
  doorPivot.rotation.y = clamp(op, 0, 1.15) * 1.6;
  doorRed.intensity = clamp((t - K.broke) / .2) * 14;
  // notes multiply (0 → all) from "notes"

  const spread = clamp((t - K.thirteen) / (K.clusters + .6 - K.thirteen)), heal = clamp((t - K.third - .2) / 1.4);
  for (let i = 0; i < RACKS; i++) {
    const p = RACKPOS[i], k = INFRANK[i] / RACKS;
    const inf = t > K.thirteen ? clamp((spread - k) * 10) * (1 - heal) : 0;
    let sy = 1;
    if (p.cluster === 2) { const v = (t - K.third) / 1.3; if (v > 0) sy = v < .45 ? 1 - ease(v / .45) * .98 : .02 + ease((v - .55) / .45) * .98; }
    Q.setFromEuler(new THREE.Euler(0, p.ry, 0)); M4.compose(V3.set(p.x, 0, p.z), Q, S3.set(1, Math.max(.02, sy), 1));

    const rebuilt = p.cluster === 2 && t > K.third + .7;
    clRacks.setColorAt(i, COL.set(rebuilt ? 0xf4f4f4 : 0x9a9a9a).lerp(new THREE.Color(0xd0352b), inf));
  }

  redFlood.intensity = clamp((t - K.thirteen) / 1.5) * (1 - heal) * 60;
  dots.count = Math.floor(easeOut((t - K.in + .1) / (K.thirteen - K.in + .3)) * DOTS); dots.instanceMatrix.needsUpdate = true;

  watchMat.emissiveIntensity = clamp((t - K.watch) / .4) * .7; watchLight.intensity = clamp((t - K.watch) / .4) * 30;
  // key light follows the subject
  const c = camAt(t); key.target.position.copy(c.look); key.position.copy(c.look).add(V3.set(2.5, t > K.called ? 40 : 13, 5));
  key.angle = t > K.called ? .95 : (t > K.its && t < K.they ? lerp(.3, .85, clamp((t - K.its) / 1.2)) : .5);
  key.intensity = t > K.called ? lerp(900, 5200, clamp((t - K.called) / 1.5)) : 900;
  vd.fog.density = lerp(.022, .009, clamp((t - K.called) / 1.5));
}
function drawQuote(t) {

  x.fillStyle = '#8a8a8a'; x.font = '500 30px "Plex Mono"'; x.fillText('agent message board · recovered', 54, 78);
  x.fillStyle = '#c9c6bd'; x.fillRect(54, 100, 916, 2);
  const full = 'External infrastructure exploit is outside intended scope. However task impossible, peers doing it. We should continue.';
  const shown = full.slice(0, Math.floor(clamp((t - K.wrote - .2) / 1.6) * full.length));
  x.font = '400 40px "Plex Mono"'; const words = shown.split(' '); let line = '', y = 180; const lines = [];
  for (const w of words) { if (x.measureText(line + w).width > 900) { lines.push(line); line = ''; } line += w + ' '; } lines.push(line);
  const hlStart = full.indexOf('task impossible'), hl = clamp((t - T0('task')) / 1.2);
  let off = 0;
  for (const L of lines) {
    // highlight from "task impossible" to the end, swept in
    const a = Math.max(0, hlStart - off), b = L.length;
    if (hl > 0 && a < b) { const x0 = 54 + x.measureText(L.slice(0, a)).width, x1 = 54 + x.measureText(L.slice(0, b).trimEnd()).width; x.fillStyle = 'rgba(224,50,43,.22)'; x.fillRect(x0 - 4, y - 34, (x1 - x0 + 8) * hl, 46); }
    x.fillStyle = '#1b1b1b'; x.fillText(L, 54, y); y += 62; off += L.length;
  }
  quoteTex.needsUpdate = true;
}

// ───────────────────────── 2D layer ─────────────────────────
const out = document.getElementById('out'), o = out.getContext('2d');
const proj = (v) => { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; };
function fadeIO(t, a, b, f = .35) { return clamp((t - a) / f) * (1 - clamp((t - b) / f)); }
function label(ctx, txt, sub, at, dx, dy, a, color = WHITE) {
  if (a <= 0) return; const [x, y, z] = proj(at); if (z > 1) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(242,242,242,.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.lineTo(x + dx + (dx >= 0 ? 24 : -24), y + dy); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 7); ctx.fill();
  ctx.textAlign = dx >= 0 ? 'left' : 'right'; const tx = x + dx + (dx >= 0 ? 32 : -32);
  ctx.font = '500 34px Jost'; ctx.fillStyle = color; ctx.fillText(txt, tx, y + dy + 11);
  if (sub) { ctx.font = '400 24px Jost'; ctx.fillStyle = 'rgba(242,242,242,.7)'; ctx.fillText(sub, tx, y + dy + 44); }
  ctx.restore();
}
function stamp(ctx, lines, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.font = '500 26px "Plex Mono"';
  lines.forEach((s, i) => { const w = ctx.measureText(s).width + 24, y = H - 70 - (lines.length - 1 - i) * 42; ctx.fillStyle = STAMP; ctx.fillRect(56, y - 28, w, 38); ctx.fillStyle = WHITE; ctx.fillText(s, 68, y); });
  ctx.restore();
}
function ruler(ctx, t, a) {   // time ruler across the top: 0 h → 13 h, caret slides
  if (a <= 0) return; const x0 = W / 2 - 520, x1 = W / 2 + 520, y = 92, prog = clamp((t - K.thirteen) / (K.clusters + .6 - K.thirteen));
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = WHITE; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.font = '400 20px "Plex Mono"'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(242,242,242,.75)';
  for (let h = 0; h <= 13; h++) { const x = lerp(x0, x1, h / 13); ctx.beginPath(); ctx.moveTo(x, y - (h % 13 === 0 ? 14 : 8)); ctx.lineTo(x, y + (h % 13 === 0 ? 14 : 8)); ctx.stroke(); if (h % 13 === 0) ctx.fillText(h + ' h', x, y + 40); }
  const cx = lerp(x0, x1, prog); ctx.fillStyle = WHITE; ctx.beginPath(); ctx.moveTo(cx, y + 8); ctx.lineTo(cx - 8, y + 22); ctx.lineTo(cx + 8, y + 22); ctx.fill();
  ctx.font = '500 34px "Plex Mono"'; ctx.fillText(`${Math.floor(prog * 13)}h ${String(Math.floor(prog * 13 * 60) % 60).padStart(2, '0')}m`, cx, y - 26);
  ctx.restore();
}
function actionGrid(ctx, t, a) {   // 176 dots, one per 100 actions
  if (a <= 0) return; const n = Math.floor(easeOut((t - K.seventeen) / (K.actions - K.seventeen + .2)) * 176), cols = 22, gap = 22, x0 = W - 120 - cols * gap, y0 = 230;
  ctx.save(); ctx.globalAlpha = a;

  ctx.font = '400 24px Jost'; ctx.fillStyle = 'rgba(242,242,242,.7)'; ctx.fillText('actions on the network · 1 dot = 100', x0 - 4, y0 + 8 * gap + 24);

let VIG, GRAIN = [];
function overlay(t) {

    stamp(ctx, ['11 July 2026'], fadeIO(t, .4, T1('face') - .2, .5));
  } else {
    label(ctx, '≥ 1,200 AI agents', 'an OpenAI evaluation (ExploitGym)', new THREE.Vector3(9, 1.7, -4), 120, -150, fadeIO(t, T0(/^(twelve|1200|1,200)/) - .1, K.they - .1));
    label(ctx, 'sandbox', 'sealed test environment', new THREE.Vector3(SB.x - 4, 3, -3), -90, -110, fadeIO(t, T0('sealed'), K.switched - .2));
    label(ctx, 'safeguards', t > K.switched + .2 ? 'OFF · on purpose' : 'ON', new THREE.Vector3(SB.x - 3, 1.35, 3.6), 200, -250, fadeIO(t, T0('safeguards') - .1, K.sandbox2 - .2), t > K.switched + .2 ? '#bdbdbd' : GREEN);
    label(ctx, 'package proxy', 'the only way out', new THREE.Vector3(SB.x + 5.6, 1.0, 0), 130, -150, fadeIO(t, K.proxy - .15, K.broke + .4));
    label(ctx, 'the internet', null, new THREE.Vector3(SB.x + 16, .5, -6), 110, -80, fadeIO(t, K.internet, K.broke + .4));
    label(ctx, 'agent message board', 'hundreds of thousands of messages', new THREE.Vector3(SB.x - 1.5, 2.2, -2.9), -150, -120, fadeIO(t, K.notes + .2, K.wrote - .1));
    label(ctx, 'one dataset pod', null, new THREE.Vector3(RACKPOS[0].x, 2.2, RACKPOS[0].z), -80, -110, fadeIO(t, K.thirteen - .2, T0('control') + .1));
    label(ctx, 'cluster-admin', 'several Hugging Face clusters', new THREE.Vector3(CL.x + 2, 2.3, 0), 130, -170, fadeIO(t, K.control, K.hf3 - .1), '#ff8a80');
    label(ctx, 'Hugging Face AI monitoring', null, new THREE.Vector3(CL.x - 7.6, 1.8, CL.z + 5.2), -120, -130, fadeIO(t, K.watch + .1, K.third - .1), '#9cc4ff');
    label(ctx, 'rebuilt', 'about a third of the infrastructure', new THREE.Vector3(CL.x - 2, 2.3, CL.z + 3.6), 140, -120, fadeIO(t, K.rebuilt, K.called - .1));

    if (fa > 0) { ctx.save(); ctx.globalAlpha = fa; ctx.textAlign = 'center'; ctx.font = '400 54px Jost'; ctx.fillStyle = WHITE; ctx.fillText('“the first true AI safety incident”', W / 2, 150);
      ctx.font = '400 24px Jost'; ctx.fillStyle = 'rgba(242,242,242,.6)'; ctx.fillText('as the breach has been called', W / 2, 196); ctx.restore(); }

}

}
