function camAt(t) {
  let pos = SHOTS[0].pos.clone(), look = SHOTS[0].look.clone(), fov = SHOTS[0].fov, tEnd = 0;
  for (const s of SHOTS) {
    if (t < s.t) break;
    if (s.dur === 0) { pos.copy(s.pos); look.copy(s.look); fov = s.fov; tEnd = s.t; continue; }
    const u = ease((t - s.t) / s.dur), p0 = pos.clone(), l0 = look.clone(), f0 = fov;
    pos.lerpVectors(p0, s.pos, u); look.lerpVectors(l0, s.look, u); fov = lerp(f0, s.fov, u); tEnd = s.t + s.dur;
    if (t < tEnd) break;

  const hold = Math.max(0, t - tEnd), dir = new THREE.Vector3().subVectors(look, pos).normalize();
  pos.addScaledVector(dir, Math.min(hold, 8) * .04);
  pos.x += Math.sin(t * .31) * .012; pos.y += Math.sin(t * .23 + 1) * .01;
  return { pos, look, fov };
}

  if (!VIG) { VIG = document.createElement('canvas'); VIG.width = W; VIG.height = H; const v = VIG.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); v.fillStyle = g; v.fillRect(0, 0, W, H);
    for (let k = 0; k < 5; k++) { const c = document.createElement('canvas'); c.width = W / 2; c.height = H / 2; const x = c.getContext('2d'), id = x.createImageData(W / 2, H / 2); for (let i = 0; i < id.data.length; i += 4) { const n = 128 + (Math.random() - .5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = n; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); GRAIN.push(c); } }
  ctx.drawImage(VIG, 0, 0);

  const b = blackAt(t); if (b > 0) { ctx.fillStyle = `rgba(0,0,0,${b})`; ctx.fillRect(0, 0, W, H); }
}

// ───────────────────────── frame (pure function of time) ─────────────────────────
function hfDrawFrame(frame) {
  const t = frame / FPS, st = stageAt(t);
  setState(t);
  const c = camAt(t); camera.position.copy(c.pos); camera.lookAt(c.look); camera.fov = c.fov; camera.updateProjectionMatrix();
  if (st === 'title') { o.fillStyle = '#000'; o.fillRect(0, 0, W, H); }
  else { renderer.render(st === 'hall' ? hall : vd, camera); o.drawImage(gl, 0, 0); }
  overlay(t);
}
window.hfReady = (async () => {

  return { duration: DURATION, frames: Math.ceil(DURATION * FPS), fps: FPS, width: W, height: H, events: EV.sort((a, b) => a.t - b.t), voice: PR_WORDS.duration };
})();
